name: LeadFinder Scan
"on":
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout leadfinder (private)
        uses: actions/checkout@v4
        with:
          repository: moneyhunterss/leadfinder
          token: ${{ secrets.LEADFINDER_PAT }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - run: pip install requests PyYAML
      
      - run: mkdir -p data && ([ -f data/leads.json ] && cp data/leads.json data/leads_prev.json || echo '[]' > data/leads_prev.json)
      
      - run: python scan.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      
      - run: python notify.py || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "scan $(date -u)" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.LEADFINDER_PAT }}
