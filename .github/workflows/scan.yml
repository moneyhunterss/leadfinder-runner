name: Notify
"on":
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout leadfinder
        uses: actions/checkout@v4
        with:
          repository: moneyhunterss/leadfinder
          token: ${{ secrets.LEADFINDER_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests PyYAML
      - name: Send new leads to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p data
          [ ! -f data/leads_prev.json ] && echo '[]' > data/leads_prev.json
          python notify.py || true
          # After notifying, save current as prev for next run
          [ -f data/leads.json ] && cp data/leads.json data/leads_prev.json
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/leads_prev.json || true
          git diff --cached --quiet || (git commit -m "update prev state" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.LEADFINDER_PAT }}
